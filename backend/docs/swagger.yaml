basePath: /
definitions:
  models.ChatMessage:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      role:
        type: string
      session_id:
        type: integer
    type: object
  models.ChatRequest:
    properties:
      message:
        type: string
      mode:
        description: Used only when session_id is omitted, to auto-create a session.
        type: string
      note_id:
        type: integer
      session_id:
        type: integer
      title:
        type: string
    type: object
  models.ChatResponse:
    properties:
      answer:
        type: string
      session_id:
        type: integer
      sources:
        items:
          $ref: '#/definitions/models.ChatSource'
        type: array
    type: object
  models.ChatSession:
    properties:
      created_at:
        type: string
      id:
        type: integer
      mode:
        description: knowledge | note
        type: string
      note_id:
        description: Present only for note conversations.
        type: integer
      title:
        description: Session title shown in the sidebar.
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.ChatSource:
    properties:
      document_id:
        type: integer
      name:
        type: string
      score:
        type: number
    type: object
  models.Document:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
  models.Note:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
info:
  contact: {}
  description: |-
    MindK AI API: notes, documents with semantic search (RAG), and AI chat over that content.
    All endpoints require authentication except /health.
  title: MindK AI API
  version: "1.0"
paths:
  /chat:
    post:
      consumes:
      - application/json
      description: Sends a message to the assistant. If session_id is omitted or 0,
        a new session is created automatically and mode ("knowledge" or "note") is
        then required; note-mode sessions also require note_id. In "knowledge" mode
        the answer is grounded in the user's notes and, when relevant, a semantic
        search over their documents (returned as sources). In "note" mode the answer
        is grounded in a single note. This endpoint has a stricter rate limit than
        the rest of the API (10 requests/minute per user) because it drives LLM calls.
      parameters:
      - description: Chat message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ChatResponse'
        "400":
          description: message is required/too long, or mode is missing/invalid for
            a new session
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: session not found
          schema:
            type: string
        "413":
          description: request body too large
          schema:
            type: string
        "429":
          description: rate limit exceeded (see Retry-After header)
          schema:
            type: string
        "500":
          description: failed to process chat request
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Ask the assistant
      tags:
      - chat
  /chat/messages/:
    post:
      consumes:
      - application/json
      description: Saves a message (role "user" or "assistant") on an existing chat
        session owned by the authenticated user. The session is identified by session_id
        in the body, not in the URL.
      parameters:
      - description: Message to save (session_id, role and content are required)
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/models.ChatMessage'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ChatMessage'
        "400":
          description: content is required/too long, or role is invalid
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: session not found
          schema:
            type: string
        "413":
          description: request body too large
          schema:
            type: string
        "500":
          description: failed to save message
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Save chat message
      tags:
      - chat-messages
  /chat/messages/{sessionId}:
    get:
      description: Returns every message on the given chat session, if it exists and
        is owned by the authenticated user. The session is identified by its ID in
        the URL.
      parameters:
      - description: Chat session ID
        in: path
        name: sessionId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ChatMessage'
            type: array
        "400":
          description: invalid session id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: session not found
          schema:
            type: string
        "500":
          description: failed to fetch chat messages
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List messages in a chat session
      tags:
      - chat-messages
  /chat/sessions:
    get:
      description: Returns every chat session owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ChatSession'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: failed to fetch sessions
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List chat sessions
      tags:
      - chat-sessions
    post:
      consumes:
      - application/json
      description: Creates a chat session. mode must be "knowledge" or "note"; note_id
        is meaningful only for "note" mode. user_id is taken from the token, not the
        body.
      parameters:
      - description: Session to create (title and mode are required)
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/models.ChatSession'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ChatSession'
        "400":
          description: title and mode are required, title too long, or mode is invalid
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "413":
          description: request body too large
          schema:
            type: string
        "500":
          description: failed to create session
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create chat session
      tags:
      - chat-sessions
  /chat/sessions/{id}:
    delete:
      description: Deletes a chat session owned by the authenticated user.
      parameters:
      - description: Chat session ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid session id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: session not found
          schema:
            type: string
        "500":
          description: failed to delete session
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete chat session
      tags:
      - chat-sessions
    get:
      description: Returns a single chat session, if it exists and is owned by the
        authenticated user.
      parameters:
      - description: Chat session ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ChatSession'
        "400":
          description: invalid session id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: session not found
          schema:
            type: string
        "500":
          description: failed to fetch session
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get chat session by ID
      tags:
      - chat-sessions
    put:
      consumes:
      - application/json
      description: Replaces title, mode and note_id of an existing chat session owned
        by the authenticated user.
      parameters:
      - description: Chat session ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated title and mode
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/models.ChatSession'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ChatSession'
        "400":
          description: invalid session id, title/mode missing, title too long, or
            mode is invalid
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: session not found
          schema:
            type: string
        "413":
          description: request body too large
          schema:
            type: string
        "500":
          description: failed to update session
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update chat session
      tags:
      - chat-sessions
  /documents:
    get:
      description: Returns every document owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Document'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: failed to fetch documents
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List documents
      tags:
      - documents
    post:
      consumes:
      - application/json
      description: Creates a document from JSON content (as opposed to a file upload).
        user_id, id and created_at are set by the server.
      parameters:
      - description: Document to create (name and content are read; other fields are
          ignored)
        in: body
        name: document
        required: true
        schema:
          $ref: '#/definitions/models.Document'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Document'
        "400":
          description: name and content are required, or name exceeds maximum length
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "413":
          description: request body too large
          schema:
            type: string
        "500":
          description: failed to create document
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create document from text
      tags:
      - documents
  /documents/{id}:
    delete:
      description: Deletes a document (and its derived chunks/embeddings) owned by
        the authenticated user.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid document id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: document not found
          schema:
            type: string
        "500":
          description: failed to delete document
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete document
      tags:
      - documents
    get:
      description: Returns a single document, if it exists and is owned by the authenticated
        user.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Document'
        "400":
          description: invalid document id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: document not found
          schema:
            type: string
        "500":
          description: failed to fetch document
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get document by ID
      tags:
      - documents
  /documents/search:
    get:
      description: Searches the authenticated user's documents by semantic relevance
        to the query.
      parameters:
      - description: Search query (max 500 characters)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Document'
            type: array
        "400":
          description: query parameter q is required, or exceeds maximum length
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: failed to search documents
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Search documents
      tags:
      - documents
  /documents/upload:
    post:
      consumes:
      - multipart/form-data
      description: Creates a document from an uploaded file. The file's text is extracted
        server-side (by extension) and stored as the document content. Maximum upload
        size is 10 MiB.
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Document'
        "400":
          description: file is required, or invalid multipart form
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "413":
          description: request body too large (over 10 MiB)
          schema:
            type: string
        "500":
          description: failed to read/save file
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Upload document file
      tags:
      - documents
  /health:
    get:
      description: Returns a fixed status payload confirming the API is running. Public
        endpoint, no authentication required.
      produces:
      - application/json
      responses:
        "200":
          description: status ok payload
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /notes:
    get:
      description: Returns every note owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Note'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: failed to fetch notes
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List notes
      tags:
      - notes
    post:
      consumes:
      - application/json
      description: Creates a note owned by the authenticated user. user_id, id, created_at
        and updated_at are set by the server; any values sent by the client for them
        are ignored.
      parameters:
      - description: Note to create (title and content are read; other fields are
          ignored)
        in: body
        name: note
        required: true
        schema:
          $ref: '#/definitions/models.Note'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Note'
        "400":
          description: title and content are required, or exceed the maximum length
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "413":
          description: request body too large
          schema:
            type: string
        "500":
          description: failed to create note
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create note
      tags:
      - notes
  /notes/{id}:
    delete:
      description: Deletes a note owned by the authenticated user.
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid note id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: note not found
          schema:
            type: string
        "500":
          description: failed to delete note
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete note
      tags:
      - notes
    get:
      description: Returns a single note, if it exists and is owned by the authenticated
        user.
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Note'
        "400":
          description: invalid note id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: note not found
          schema:
            type: string
        "500":
          description: failed to fetch note
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get note by ID
      tags:
      - notes
    put:
      consumes:
      - application/json
      description: Replaces title and content of an existing note owned by the authenticated
        user. user_id is taken from the token, not the body.
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated title and content
        in: body
        name: note
        required: true
        schema:
          $ref: '#/definitions/models.Note'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Note'
        "400":
          description: invalid note id, or title/content missing/too long
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: note not found
          schema:
            type: string
        "413":
          description: request body too large
          schema:
            type: string
        "500":
          description: failed to update note
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update note
      tags:
      - notes
securityDefinitions:
  BearerAuth:
    description: 'Clerk session token. Format: "Bearer <token>".'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
