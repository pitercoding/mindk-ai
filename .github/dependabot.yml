version: 2

updates:
  # Frontend (npm)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps instead of one PR per package.
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Backend (Go modules)
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # Backend Docker image
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  # GitHub Actions used by .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
